spring:
  application:
    name: Graduation-Agent-Project

  profiles:
    active: dev

  # 数据库连接占位符：真实值放在本地 application-dev.yaml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/anime_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8}
    username: ${MYSQL_USERNAME:replace-me}
    password: ${MYSQL_PASSWORD:replace-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 禁止 Spring Boot 自动执行 classpath 下的 schema.sql；
  # 建表统一手动执行 db/schema.sql。
  sql:
    init:
      mode: never


  # LLM 配置：OpenAI 兼容接口 + 千问模型；真实 key 放在本地环境变量中。
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
      api-key: ${ALI-API-KEY:replace-me}
      timeout: 60s
      chat:
        model: ${OPENAI_MODEL:qwen3.8-flash}
        temperature: 0
        max-tokens: 2048
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
